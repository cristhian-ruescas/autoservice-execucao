name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify:
    name: Build, test and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Test with JaCoCo gate
        run: chmod +x ./mvnw && ./mvnw -B verify --no-transfer-progress
      - uses: azure/setup-kubectl@v4
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/k8s.yaml && test -s /tmp/k8s.yaml

  sonar:
    name: Sonar
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: SonarCloud when token exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x ./mvnw
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN ausente; quality gate remoto ignorado"
            exit 0
          fi
          ./mvnw -B sonar:sonar -Dsonar.token="$SONAR_TOKEN"
