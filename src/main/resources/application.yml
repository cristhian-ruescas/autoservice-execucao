server:
  port: 8083

spring:
  application:
    name: autoservice-execucao
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/autoservice_execucao}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  jackson:
    deserialization:
      USE_BIG_DECIMAL_FOR_FLOATS: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  statsd:
    metrics:
      export:
        enabled: ${DD_METRICS_EXPORT:false}
        host: ${DD_AGENT_HOST:localhost}
        port: 8125
        flavor: datadog
  metrics:
    tags:
      env: ${DD_ENV:local}
      service: ${DD_SERVICE:autoservice-execucao}
      application: ${spring.application.name}

autoservice:
  metrics:
    publish-interval-ms: ${AUTOSERVICE_METRICS_PUBLISH_INTERVAL_MS:60000}
  jwt:
    secret: ${AUTOSERVICE_JWT_SECRET:dev-secret-change-me-please-32b}
  execucao:
    automatica: ${EXECUCAO_AUTOMATICA:true}
    falhar: ${EXECUCAO_FALHAR:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
