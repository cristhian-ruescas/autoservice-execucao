apiVersion: v1
kind: ConfigMap
metadata:
  name: autoservice-execucao
  namespace: autoservice-execucao
data:
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: guest
  EXECUCAO_AUTOMATICA: "false"
  EXECUCAO_FALHAR: "false"
  DD_ENV: homolog
  DD_SERVICE: autoservice-execucao
  DD_TRACE_ENABLED: "true"
  DD_LOGS_INJECTION: "true"
  DD_METRICS_EXPORT: "true"
